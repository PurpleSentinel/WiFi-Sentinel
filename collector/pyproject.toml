[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-sentinel"
version = "1.3.1"
description = "Passive ESP32-C6/C5 Wi-Fi management-frame IDS collector and dashboard"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
wifi-sentinel = "wids.cli:main"

[tool.setuptools]
packages = ["wids"]

[tool.setuptools.package-data]
wids = ["static/*.html", "data/*.gz", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
